version: '3.8'
services:
  db:
    image: postgres:15.3-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "54321:5432"

#  migration:
#    image: kraleksey/phyhub:latest
#    command: python manage.py migrate --noinput
#    volumes:
#      - static_volume:/app/static/
#      - media_volume:/app/media/
#    env_file:
#      - .env
#    depends_on:
#      - db

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  web:
    build:
      context: ../backend
      dockerfile: DevDockerfile
    restart: unless-stopped
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    env_file:
      - .env
#    depends_on:
#      - migration
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn PhyHub2.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      - db
      - rabbitmq

  celery-worker:
    build:
      context: ../backend
      dockerfile: DevDockerfile
    restart: unless-stopped
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    command: celery --app=PhyHub2 worker --pool=prefork --loglevel=DEBUG
    depends_on:
      - db
      - web
      - rabbitmq
    profiles: [celery]
    env_file:
      - .env

  celery-beat:
    build:
      context: ../backend
      dockerfile: DevDockerfile
    restart: unless-stopped
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    command: celery --app=PhyHub2 beat --loglevel=DEBUG --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - web
      - celery-worker
      - rabbitmq
    profiles: [celery]
    env_file:
      - .env

  hub-nginx:
    image: nginx:1.25.1
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/html/static/
      - media_volume:/var/html/media/
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  rabbitmq_data:

networks:
  network-example:
    external: true
